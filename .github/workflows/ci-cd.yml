name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore GroceryShop.sln
      - run: dotnet build GroceryShop.sln --configuration Release --no-restore
      - run: dotnet publish src/GroceryShop.Api/GroceryShop.Api.csproj -c Release -o publish/api

  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ai-service/requirements.txt
      - run: |
          cd ai-service
          python -m py_compile app/main.py
          python -m py_compile app/services/retriever.py
          python -m py_compile app/services/generator.py
          python -m py_compile app/services/chat_service.py

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd web && npm ci && npm run build

  deploy:
    needs: [build-dotnet, build-python, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_REPO_PATH: ${{ secrets.VPS_REPO_PATH }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" bash -se <<'REMOTE'
            set -euo pipefail
            cd "${VPS_REPO_PATH:-/home/rogerclaude/ai-delivery-grocery-shop}"
            git fetch --quiet origin main
            git reset --hard origin/main
            docker compose build grocery-api grocery-ai grocery-web
            docker compose up -d grocery-api grocery-ai grocery-web
          REMOTE

  smoke-test:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Wait for services to settle
        run: sleep 30
      - name: Smoke test public endpoints
        run: |
          set -euo pipefail
          curl -fsS https://aideliverygroceryshop.cloudaura.cloud/api/v1/categories > /dev/null
          curl -fsS https://aideliverygroceryshop.cloudaura.cloud/api/health > /dev/null
          curl -fsS https://aideliverygroceryshop.cloudaura.cloud/stores | grep -q "Lakeland"
          echo "Smoke tests passed."
